<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 320" fill="none">
  <!-- Construction diagram - shows the geometric logic -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#1C1917" opacity="0.5"/>
    </marker>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="3" fill="#1C1917" opacity="0.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="256" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1C1917" opacity="0.6">CONSTRUCTION — OMNICFO MARK</text>

  <!-- Left: Base geometry (ledger column) -->
  <g transform="translate(40, 60)">
    <text x="64" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#1C1917" opacity="0.5">BASE GEOMETRY</text>
    <!-- Ruled column -->
    <rect x="64" y="0" width="2" height="160" fill="#1C1917" opacity="0.8"/>
    <g stroke="#1C1917" stroke-width="0.5" opacity="0.2">
      <line x1="0" y1="16" x2="128" y2="16"/>
      <line x1="0" y1="32" x2="128" y2="32"/>
      <line x1="0" y1="48" x2="128" y2="48"/>
      <line x1="0" y1="64" x2="128" y2="64"/>
      <line x1="0" y1="80" x2="128" y2="80"/>
      <line x1="0" y1="96" x2="128" y2="96"/>
      <line x1="0" y1="112" x2="128" y2="112"/>
      <line x1="0" y1="128" x2="128" y2="128"/>
      <line x1="0" y1="144" x2="128" y2="144"/>
    </g>
    <!-- Dimensions -->
    <line x1="140" y1="0" x2="140" y2="160" stroke="#1C1917" stroke-width="0.75" stroke-dasharray="4 4" marker-end="url(#arrow)" opacity="0.5"/>
    <text x="150" y="80" font-family="monospace" font-size="9" fill="#1C1917" opacity="0.5">16 units</text>
    <line x1="64" y1="-10" x2="192" y2="-10" stroke="#1C1917" stroke-width="0.75" stroke-dasharray="4 4" marker-end="url(#arrow)" opacity="0.5"/>
    <text x="128" y="-18" text-anchor="middle" font-family="monospace" font-size="9" fill="#1C1917" opacity="0.5">128 units</text>
  </g>

  <!-- Center: Checkmark integration -->
  <g transform="translate(200, 60)">
    <text x="64" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#1C1917" opacity="0.5">INTEGRATION</text>
    <rect x="64" y="0" width="2" height="160" fill="#1C1917" opacity="0.8"/>
    <g stroke="#1C1917" stroke-width="0.5" opacity="0.2">
      <line x1="0" y1="16" x2="128" y2="16"/>
      <line x1="0" y1="32" x2="128" y2="32"/>
      <line x1="0" y1="48" x2="128" y2="48"/>
      <line x1="0" y1="64" x2="128" y2="64"/>
      <line x1="0" y1="80" x2="128" y2="80"/>
      <line x1="0" y1="96" x2="128" y2="96"/>
      <line x1="0" y1="112" x2="128" y2="112"/>
      <line x1="0" y1="128" x2="128" y2="128"/>
      <line x1="0" y1="144" x2="128" y2="144"/>
    </g>
    <!-- Checkmark at row 4 (center) -->
    <path d="M40 72L56 88L88 56" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Alignment guides -->
    <line x1="56" y1="72" x2="56" y2="88" stroke="#1C1917" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.3"/>
    <line x1="56" y1="88" x2="88" y2="88" stroke="#1C1917" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.3"/>
    <circle cx="56" cy="72" r="3" fill="#1C1917" opacity="0.3"/>
    <circle cx="56" cy="88" r="3" fill="#1C1917" opacity="0.3"/>
    <circle cx="88" cy="88" r="3" fill="#1C1917" opacity="0.3"/>
    <text x="70" y="70" font-family="monospace" font-size="8" fill="#1C1917" opacity="0.4">3:4:5 ratio</text>
  </g>

  <!-- Right: Favicon reduction -->
  <g transform="translate(380, 90)">
    <text x="64" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#1C1917" opacity="0.5">FAVICON REDUCTION (16px)</text>
    <rect x="48" y="16" width="1.5" height="64" fill="#1C1917"/>
    <g fill="#1C1917">
      <rect x="8" y="24" width="40" height="1"/>
      <rect x="8" y="40" width="40" height="1"/>
      <rect x="8" y="56" width="40" height="1"/>
    </g>
    <path d="M16 40L24 48L40 24" stroke="#1C1917" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Bottom: Proportions & spacing -->
  <g transform="translate(40, 250)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#1C1917" opacity="0.5">PROPORTIONS</text>
    <text x="0" y="18" font-family="monospace" font-size="9" fill="#1C1917" opacity="0.4">Column rule: 1.5/128  •  Row height: 16  •  Checkmark stroke: 2.5  •  Checkmark ratio: 3:4:5  •  Paper fold: 12×12  •  Wordmark gap: 8  •  CFO tracking: +1.2</text>
  </g>
</svg>