<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Single-color glyph: ruled column + checkmark, works at 16px -->
  <!-- Vertical rule -->
  <rect x="16" y="4" width="1.5" height="24" fill="currentColor"/>
  <!-- Horizontal rules (3 lines for clarity at small size) -->
  <g fill="currentColor">
    <rect x="6" y="8" width="20" height="0.75"/>
    <rect x="6" y="16" width="20" height="0.75"/>
    <rect x="6" y="24" width="20" height="0.75"/>
  </g>
  <!-- Checkmark integrated at column -->
  <path d="M10 19L15 24L22 14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>